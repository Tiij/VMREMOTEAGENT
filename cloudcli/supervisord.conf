[supervisord]
nodaemon=true
user=agent
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
logfile_maxbytes=1MB
logfile_backups=1

[program:cloudcli]
command=/usr/local/bin/cloudcli start --port 3001
directory=/home/agent/workspace
environment=HOME="/home/agent",USER="agent"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopsignal=SIGTERM
stopwaitsecs=15
stopasgroup=true
killasgroup=true

[program:codeserver]
command=/usr/local/bin/code-server --bind-addr 0.0.0.0:8080 --disable-telemetry /home/agent/workspace
directory=/home/agent/workspace
environment=HOME="/home/agent",USER="agent"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopsignal=SIGTERM
stopwaitsecs=15
stopasgroup=true
killasgroup=true
